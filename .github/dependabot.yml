version: 2

updates:
  # The one action here is first-party and stays on a major tag deliberately:
  # GitHub owns both the tag and the content a SHA would pin, so pinning moves
  # trust from GitHub to GitHub. This entry is what keeps that tag current.
  #
  # The two linters ARE pinned, by image digest, because they are third party.
  # They sit inside `run: docker run ...` blocks, which this ecosystem does not
  # read, so those move by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
